services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agencyos
      POSTGRES_PASSWORD: agencyos
      POSTGRES_DB: agencyos
    ports:
      - "5433:5432"
    volumes:
      - agencyos_postgres_data:/var/lib/postgresql/data

volumes:
  agencyos_postgres_data:
